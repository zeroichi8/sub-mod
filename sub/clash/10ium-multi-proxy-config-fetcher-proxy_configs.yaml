global-client-fingerprint: "chrome"
keep-alive-interval: 5
keep-alive-idle: 10
disable-keep-alive: false
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
tcp-concurrent: true
enable-process: true
find-process-mode: "always"
ipv6: false
log-level: "info"
geo-auto-update: true
geo-update-interval: 168
secret: ""
bind-address: "*"
unified-delay: false
dns:
  enable: true
  ipv6: false
  prefer-h3: false
  cache-algorithm: "arc"
  use-system-hosts: true
  use-host: true
  listen: "0.0.0.0:53"
  enhanced-mode: "fake-ip"
  fake-ip-filter-mode: "blacklist"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter:
    - "*.lan"
    - "*.localdomain"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "*.local"
    - "*.home.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "*.ir"
  default-nameserver:
    - "1.1.1.1"
    - "8.8.8.8"
    - "9.9.9.9"
  nameserver:
    - "tcp://1.1.1.1"
    - "tcp://1.0.0.1"
    - "tcp://8.8.8.8"
    - "tcp://8.8.4.4"
    - "tcp://9.9.9.9"
    - "tcp://149.112.112.112"
    - "tcp://208.67.222.222"
    - "tcp://208.67.220.222"
  fallback:
    - "tcp://76.76.19.19"
    - "tcp://76.223.122.150"
    - "tcp://185.228.168.9"
    - "tcp://185.228.169.9"
    - "tcp://8.26.56.26"
