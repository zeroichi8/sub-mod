global-client-fingerprint: "chrome"
keep-alive-interval: 5
keep-alive-idle: 10
disable-keep-alive: false
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
tcp-concurrent: true
enable-process: true
find-process-mode: "always"
ipv6: false
log-level: "info"
geo-auto-update: true
geo-update-interval: 168
secret: ""
bind-address: "*"
unified-delay: false
dns:
  enable: true
  ipv6: false
  prefer-h3: false
  cache-algorithm: "arc"
  use-system-hosts: true
  use-host: true
  listen: "0.0.0.0:53"
  enhanced-mode: "fake-ip"
