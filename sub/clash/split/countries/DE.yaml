keep-alive-interval: 5
keep-alive-idle: 10
disable-keep-alive: false
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
tcp-concurrent: true
enable-process: true
find-process-mode: "always"
ipv6: false
