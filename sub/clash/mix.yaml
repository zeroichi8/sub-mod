    - "*.lan"
    - "*.localdomain"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "*.local"
    - "*.home.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "*.ir"
  default-nameserver:
    - "1.1.1.1"
    - "8.8.8.8"
    - "9.9.9.9"
  nameserver:
    - "tcp://1.1.1.1"
    - "tcp://1.0.0.1"
    - "tcp://8.8.8.8"
    - "tcp://8.8.4.4"
    - "tcp://9.9.9.9"
    - "tcp://149.112.112.112"
    - "tcp://208.67.222.222"
    - "tcp://208.67.220.222"
  fallback:
    - "tcp://76.76.19.19"
    - "tcp://76.223.122.150"
    - "tcp://185.228.168.9"
    - "tcp://185.228.169.9"
    - "tcp://8.26.56.26"
    - "tcp://8.20.247.20"
    - "tcp://76.76.2.11"
    - "tcp://76.76.10.11"
    - "tcp://84.200.69.80"
    - "tcp://84.200.70.40"
    - "tcp://45.33.97.5"
    - "tcp://37.235.1.177"
    - "tcp://209.244.0.3"
    - "tcp://209.244.0.4"
    - "tcp://156.154.70.5"
    - "tcp://156.154.71.5"
    - "tcp://103.86.96.100"
    - "tcp://103.86.99.100"
    - "tcp://199.85.126.10"
    - "tcp://199.85.127.10"
    - "tcp://129.250.35.250"
    - "tcp://129.250.35.251"
    - "tcp://94.16.114.254"
    - "tcp://94.247.43.254"
    - "tcp://208.67.222.20"
    - "tcp://195.46.39.39"
    - "tcp://195.46.39.40"
