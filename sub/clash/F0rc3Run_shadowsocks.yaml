    - "tcp://194.169.169.169"
    - "tcp://156.154.70.1"
    - "tcp://156.154.71.1"
    - "tcp://91.239.100.100"
    - "tcp://89.233.43.71"
    - "tcp://64.6.64.6"
    - "tcp://64.6.65.6"
    - "tcp://77.88.8.8"
    - "tcp://77.88.8.1"
